<style>
:root{
  --blue:#5BCEFA; --pink:#F5A9B8; --flagwhite:#FFFFFF;
  --bg:#F7FBFF; --surface:#FFFFFF; --blush:#FDEFF3; --sky:#E8F6FE;
  --ink:#2D2A32; --muted:#6B6574; --line:#E3E8F1; --line-pink:#F4CFD9;
  --link:#1F5CE0; --green:#1E7A45; --green-bg:#E3F6E8;
  --red:#B32E45; --red-bg:#FCE7E9; --amber:#7F5400; --amber-bg:#FFE9B3;
  --input:#FFFCEF; --tabbar:rgba(255,255,255,.94); --track:#EDF1F7;
  --display:"Bricolage Grotesque", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141C; --surface:#211E29; --blush:#35222D; --sky:#172A36;
    --ink:#F4EFF7; --muted:#A79FB2; --line:#322E3C; --line-pink:#56364A;
    --link:#8FD9FB; --green:#74D69E; --green-bg:#16331F;
    --red:#FF9DAC; --red-bg:#3F1D27; --amber:#FFD27A; --amber-bg:#3A2D13;
    --input:#262230; --tabbar:rgba(28,25,35,.94); --track:#2C2836;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141C; --surface:#211E29; --blush:#35222D; --sky:#172A36;
  --ink:#F4EFF7; --muted:#A79FB2; --line:#322E3C; --line-pink:#56364A;
  --link:#8FD9FB; --green:#74D69E; --green-bg:#16331F;
  --red:#FF9DAC; --red-bg:#3F1D27; --amber:#FFD27A; --amber-bg:#3A2D13;
  --input:#262230; --tabbar:rgba(28,25,35,.94); --track:#2C2836;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
img{max-width:100%}

.flag{display:flex;flex-direction:column;height:10px;border-radius:0 0 6px 6px;overflow:hidden}
.flag i{flex:1}
.flag i:nth-child(1),.flag i:nth-child(5){background:var(--blue)}
.flag i:nth-child(2),.flag i:nth-child(4){background:var(--pink)}
.flag i:nth-child(3){background:var(--flagwhite)}

main{max-width:560px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
.screen{display:none}
.screen.on{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 14px}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.02em;margin:0;font-variation-settings:"opsz" 72}
h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:28px 0 10px}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.soft{background:var(--sky);color:var(--ink)}
.btn.pink{background:var(--pink);color:#2D2A32}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* affirmation: the loud thing */
.affirm{background:var(--blush);border:1.5px solid var(--line-pink);border-radius:26px;padding:20px 20px 16px;position:relative;overflow:hidden}
.affirm .lead{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.affirm blockquote{margin:8px 0 12px;font-family:var(--display);font-weight:700;font-size:27px;line-height:1.12;letter-spacing:-.015em;font-variation-settings:"opsz" 60;min-height:2.2em}
.affirm .row{display:flex;justify-content:space-between;align-items:center}
.affirm .stripes{position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;overflow:hidden;display:flex;flex-direction:column;opacity:.55;transform:rotate(-18deg)}
.affirm .stripes i{flex:1}
.affirm .stripes i:nth-child(1),.affirm .stripes i:nth-child(5){background:var(--blue)}
.affirm .stripes i:nth-child(2),.affirm .stripes i:nth-child(4){background:var(--pink)}
.affirm .stripes i:nth-child(3){background:var(--flagwhite)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.alert .ic{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--sky)}
.alert.l0{border-color:var(--red);background:var(--red-bg)}
.alert.l0 .ic{background:var(--surface)}
.alert.l1{border-color:#E7B84A;background:var(--amber-bg)}
.alert.l1 .ic{background:var(--surface)}
.alert .at{display:block;font-weight:700;line-height:1.25;color:var(--ink)}
.alert .as{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* payday */
.payday{background:var(--sky);border-radius:20px;padding:16px 18px}
.payday .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.payday ul{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid rgba(91,206,250,.45)}
.payday li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(91,206,250,.3);font-size:15px}
.payday li:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}

/* totals */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.stat strong{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* bill cards */
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bill{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.bill .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bill .name{font-weight:700;font-size:17px;line-height:1.25}
.bill .amt{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.s-funded,.h-set{background:var(--green-bg);color:var(--green)}
.s-overdue,.h-overdue{background:var(--red-bg);color:var(--red)}
.s-week,.h-today{background:var(--amber-bg);color:var(--amber)}
.s-soon,.h-coming{background:var(--blush);color:var(--red)}
.s-track,.h-weekish{background:var(--sky);color:var(--link)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:2px 0 12px}

<script id="logic">
/* ---------- lists (from the spreadsheet's Lists tab) ---------- */
var DEFAULT_CATS=["🏠 Housing/Rent","⚡ Utilities","🛡️ Insurance","📺 Subscriptions","💳 Debt/Loans","💊 Medical/HRT","🩺 Gender-Affirming Care","🎀 Wardrobe/Closet","💅 Self-Care/Beauty","📄 Legal (Name/ID Change)","🚗 Transportation","🛒 Groceries/Essentials","🎉 Fun/Personal","✨ Other/Misc"];
var FREQ={"Weekly":{months:0,days:7},"Biweekly":{months:0,days:14},"Monthly":{months:1,days:0},"Quarterly":{months:3,days:0},"Semi-Annually":{months:6,days:0},"Annually":{months:12,days:0},"One-Time":{months:0,days:0}};
var AFFIRMATIONS=["you're so real for budgeting like this 🎀","soft girl, stacked coins 💰","your future self says thank you 🥹","paying bills on time is giving main character energy","small steps, big glow up ✨","euphoria and emergency funds, name a more iconic duo","the girls that budget are the girls that thrive 💅","progress not perfection, bestie","her: exists. also her: has a fully automated bill tracker","you deserve every good thing coming your way 🏳️‍⚧️","financially responsible AND thriving? she's multitasking","this is your sign to check your bank app... it's probably fine","you're built different (in a well-organized-spreadsheet way)","look at you, being stable AND stylish"];

/* ---------- date math, done in whole days like a spreadsheet ---------- */
var DAY=86400000;
function toDays(s){ if(!s) return null; var p=String(s).split("-").map(Number); if(p.length<3||!p[0]) return null; return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY); }
function parts(n){ var d=new Date(n*DAY); return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),dow:d.getUTCDay()}; }
function toISO(n){ var p=parts(n); return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
function todayDays(){ var t=new Date(); return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY); }
function wd(n){ return ((parts(n).dow+6)%7)+1; }            /* Excel WEEKDAY(x,2): Mon=1 … Sun=7 */
function mod(a,n){ return ((a%n)+n)%n; }                    /* Excel MOD sign rules */
function edate(n,k){ var p=parts(n); var tot=p.y*12+(p.m-1)+k; var ny=Math.floor(tot/12), nm=tot-ny*12; var last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate(); return Math.round(Date.UTC(ny,nm,Math.min(p.d,last))/DAY); }
function monthsBetween(a,b){ var A=parts(a),B=parts(b); var m=(B.y-A.y)*12+(B.m-A.m); if(B.d<A.d) m--; return Math.max(0,m); } /* DATEDIF "m" */
function wedOnOrBefore(n){ return n-mod(wd(n)-3,7); }
function wedOnOrAfter(n){ return n+mod(3-wd(n),7); }
function num(v){ if(v===""||v===null||v===undefined) return null; var x=Number(v); return isFinite(x)?x:null; }

/* ---------- the ⚙️ Engine tab, one bill at a time ---------- */
function computeBill(b,T){
  var out={next:null,saveBy:null,weeksLeft:null,weekly:null,saved:null,needed:null,pct:null,status:null,key:null,missingStart:false};
  if(!b||!b.name) return out;
  var due=toDays(b.due); if(due===null) return out;
  var iv=FREQ[b.freq]; if(!iv) iv={months:0,days:0};
  var oneTime=b.freq==="One-Time";
  var C=0;
  if(!oneTime && T>due){
    if(iv.days>0){
      C=Math.max(0,Math.ceil((T-due)/iv.days));
    } else if(iv.months>0){
      var B=monthsBetween(due,T), q=Math.floor(B/iv.months);
      C=q+(edate(due,q*iv.months)<T?1:0);
    }
  }
  var D=oneTime?due:(iv.days>0?due+C*iv.days:edate(due,C*iv.months));
  var E=wedOnOrBefore(D);
  var G=null;
  if(oneTime){ var S=toDays(b.start); G=S===null?null:wedOnOrAfter(S); if(S===null) out.missingStart=true; }
  else { var F=iv.days>0?D-iv.days:edate(D,-iv.months); G=wedOnOrBefore(F)+7; }
  var V=wedOnOrAfter(T);
  var I=Math.max(0,(E-V)/7+1);
  out.next=D; out.saveBy=E; out.weeksLeft=I;
  var amt=num(b.amount);
  var M=null;
  if(G!==null && amt!==null){
    var H=Math.max(1,(E-G)/7+1);
    var J=amt/H, K=Math.max(0,H-I);
    var L=Math.min(amt,J*K);
    M=Math.max(0,amt-L);
    out.saved=L; out.needed=M; out.pct=amt>0?L/amt:null;
    out.weekly=M===0?0:(I<=1?M:Math.min(J,M));
  }
  if(M===0){out.status="✅ fully funded";out.key="funded";}
  else if(D<T){out.status="🚨 overdue - fix this today";out.key="overdue";}
  else if(I<=1){out.status="⏳ due this week";out.key="week";}
  else if(I<=2){out.status="⚠️ coming up soon";out.key="soon";}
  else {out.status="💪 on track";out.key="track";}
  return out;
}

</script>

<script>
(function(){
"use strict";
/* ---------- state + storage ---------- */
var LS_KEY="bestie-bill-tracker-v1", TAB_KEY="bestie-bill-tracker-tab";
var state={bills:[],hrt:[],paycheck:0,updatedAt:null,categories:DEFAULT_CATS.slice(),owed:[]};
var affIdx=Math.floor(Math.random()*AFFIRMATIONS.length), vibeSeed=Math.random();
var tab="home", moneyView="owe";

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normalize(d){
  d=d||{};
  var bills=(Array.isArray(d.bills)?d.bills.filter(Boolean):[]).map(function(b){
    if(b&&b.plan){ b.plan.log=Array.isArray(b.plan.log)?b.plan.log:[]; }
    return b;
  });
  var owed=(Array.isArray(d.owed)?d.owed.filter(Boolean):[]).map(function(o){
    o.log=Array.isArray(o.log)?o.log:[];
    o.extensions=Array.isArray(o.extensions)?o.extensions:[];
    return o;
  });
  return {bills:bills,hrt:Array.isArray(d.hrt)?d.hrt.filter(Boolean):[],paycheck:num(d.paycheck)||0,updatedAt:d.updatedAt||null,
    categories:Array.isArray(d.categories)&&d.categories.length?d.categories.filter(Boolean):DEFAULT_CATS.slice(),owed:owed};
}
function readCache(){ try{ var s=localStorage.getItem(LS_KEY); return s?normalize(JSON.parse(s)):null; }catch(e){ return null; } }
function writeCache(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
try{ var t0=localStorage.getItem(TAB_KEY); if(t0) tab=t0; }catch(e){}
var cached=readCache();
if(cached) state=cached;
else state={bills:[
  {id:"ex1",name:"🌟 Example: One-Time Bill (edit or delete me)",cat:"✨ Other/Misc",freq:"One-Time",amount:100,due:"2026-10-14",start:"2026-09-23",notes:"This is the exact $100-in-4-weeks example — watch weeks remaining and saved so far update as Wednesdays pass.",plan:null},
  {id:"ex2",name:"🌟 Example: Recurring Bill, due on a Friday (edit or delete me)",cat:"⚡ Utilities",freq:"Monthly",amount:60,due:"2026-10-30",start:"",notes:"Due date is a FRIDAY — see how 'money must be saved by' rounds back to the Wednesday before it, and next month it rolls forward on its own.",plan:null}
],hrt:[],paycheck:0,updatedAt:null,categories:DEFAULT_CATS.slice(),owed:[]};

function commit(){ state.updatedAt=new Date().toISOString(); writeCache(); render(); }

/* ---------- payment-plan + owed-to-me helpers ---------- */
function planInfo(b){
  if(!b||!b.plan) return null;
  var p=b.plan, total=num(p.total)||0, paid=0;
  (p.log||[]).forEach(function(e){ var a=num(e.amount); if(a) paid+=a; });
  paid=Math.round(paid*100)/100;
  var remaining=Math.max(0,Math.round((total-paid)*100)/100);
  var amt=num(b.amount)||0;
  var cyclesLeft=amt>0?Math.max(0,Math.ceil(remaining/amt-1e-9)):null;
  var complete=total>0&&remaining<=0.005;
  return {total:total,paid:paid,remaining:remaining,cyclesLeft:cyclesLeft,pct:total>0?Math.min(1,paid/total):0,complete:complete};
}
function findOwed(id){ for(var i=0;i<state.owed.length;i++) if(state.owed[i].id===id) return i; return -1; }
function owedPaid(o){ var s=0; (o.log||[]).forEach(function(e){ var a=num(e.amount); if(a) s+=a; }); return Math.round(s*100)/100; }
function owedStatus(o,T){
  var total=num(o.total)||0, paid=owedPaid(o), remaining=Math.max(0,Math.round((total-paid)*100)/100);
  var complete=total>0&&remaining<=0.005;
  var dueDays=(!o.noDeadline&&o.deadline)?toDays(o.deadline):null;
  var status,key;
  if(complete){ status="✅ paid back in full"; key="funded"; }
  else if(dueDays===null){ status="🤝 pay when they can"; key="track"; }
  else if(dueDays<T){ status="🚨 overdue"; key="overdue"; }
  else if(dueDays-T<=7){ status="⏳ due soon"; key="week"; }
  else { status="📅 on track"; key="track"; }
  return {total:total,paid:paid,remaining:remaining,complete:complete,status:status,key:key,dueDays:dueDays};
}

/* ---------- formatting ---------- */
var money=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function $m(v){ return v===null||v===undefined?"—":money.format(v); }
var MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"], WDS=["sun","mon","tue","wed","thu","fri","sat"], WDL=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function fdate(n,withDow){ if(n===null||n===undefined) return "—"; var p=parts(n), T=parts(todayDays()); return (withDow?WDS[p.dow]+", ":"")+MON[p.m-1]+" "+p.d+(p.y!==T.y?", "+p.y:""); }
function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function plural(n,w){ return n+" "+w+(n===1?"":"s"); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2200); }

/* ---------- derived numbers ---------- */
function derive(){
  var T=todayDays();
  var bills=state.bills.map(function(b){
    var c=computeBill(b,T);
    if(b.plan){
      var pi=planInfo(b);
      if(pi&&pi.complete){ c.weekly=0; c.needed=0; c.status="🎉 paid off"; c.key="funded"; }
    }
    return {b:b,c:c};
  });
  bills.sort(function(x,y){ var a=x.c.next, b=y.c.next; if(a===null&&b===null) return 0; if(a===null) return 1; if(b===null) return -1; return a-b; });
  var tot={amount:0,weekly:0,saved:0,needed:0};
  var cats={}; state.categories.forEach(function(k){ cats[k]={weekly:0,owed:0,saved:0,count:0}; });
  bills.forEach(function(x){
    var a=num(x.b.amount); if(a!==null) tot.amount+=a;
    if(x.c.weekly!==null) tot.weekly+=x.c.weekly;

/* ---------- editor sheet ---------- */
var sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"), sheetBody=document.getElementById("sheetBody");
function openSheet(title,html){ document.getElementById("sheetTitle").textContent=title; sheetBody.innerHTML=html; sheet.classList.add("on"); scrim.classList.add("on"); sheetBody.scrollTop=0; }
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
function opts(list,sel,blank){ return (blank?'<option value="">'+blank+'</option>':'')+list.map(function(o){return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>';}).join(""); }

function billForm(b){

      h+='<div class="field" id="peffWrap" hidden><label>what should this do?</label><div class="segflex"><label class="seg"><input type="radio" name="peffect" value="lower" checked> lower my payment per cycle</label><label class="seg"><input type="radio" name="peffect" value="same"> keep payment the same, pay off sooner</label></div></div>';

    } else {

  }
  return h;
}
function findBill(id){ for(var i=0;i<state.bills.length;i++) if(state.bills[i].id===id) return i; return -1; }
function cleanAmount(v){ v=String(v||"").replace(/[$,\s]/g,""); if(v==="") return ""; var n=Number(v); return isFinite(n)?Math.round(n*100)/100:""; }

      h+='<button type="button" class="link" id="undoOwedPay" data-owed="'+esc(o.id)+'" style="margin-top:8px">undo last payment</button>';

sheetBody.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f-freq"){ var sw=document.getElementById("startWrap"); if(sw) sw.hidden=t.value!=="One-Time"; }
  if(t.id==="f-isplan"||t.name==="pmode"){
    var isPlanEl=document.getElementById("f-isplan");
    if(isPlanEl){
      var isPlan=isPlanEl.checked;
      var modeEl=sheetBody.querySelector('input[name="pmode"]:checked');
      var isAuto=isPlan&&modeEl&&modeEl.value==="auto";
      var pf=document.getElementById("planFields"); if(pf) pf.hidden=!isPlan;
      var pt=document.getElementById("ptermWrap"); if(pt) pt.hidden=!isAuto;
      var aw=document.getElementById("amtWrap"); if(aw){ aw.hidden=isAuto; var lbl=aw.querySelector("label"); if(lbl) lbl.textContent=isPlan?"payment per cycle":"total bill amount"; }
      var freqLbl=document.querySelector('label[for="f-freq"]'); if(freqLbl) freqLbl.textContent=isPlan?"payment cycle":"frequency";
    }
  }
  if(t.name==="ptype"){ var pe=document.getElementById("peffWrap"); if(pe) pe.hidden=t.value!=="extra"; }
  if(t.id==="o-nodl"){ var dw=document.getElementById("dlWrap"); if(dw) dw.hidden=t.checked; }
  if(t.name==="style"){ var pw=document.getElementById("planWrap"); if(pw) pw.hidden=t.value!=="plan"; }
});
sheetBody.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target, fd=new FormData(f), id=f.dataset.id;
  if(f.id==="billForm"){
    var name=String(fd.get("name")||"").trim();
    if(!name){ document.getElementById("nameErr").innerHTML='<p class="err">add a name so it shows up in your list</p>'; f.querySelector("[name=name]").focus(); return; }
    document.getElementById("nameErr").innerHTML="";
    var isPlan=fd.get("isplan")==="on";
    var freqVal=fd.get("freq")||"Monthly";
    document.getElementById("freqErr").innerHTML=""; document.getElementById("ptotalErr").innerHTML="";
    if(isPlan&&freqVal==="One-Time"){ document.getElementById("freqErr").innerHTML='<p class="err">payment plans need a repeating cycle — pick something other than one-time</p>'; return; }
    var planObj=null;
    if(isPlan){
      var totalP=cleanAmount(fd.get("ptotal"));
      if(totalP===""||totalP<=0){ document.getElementById("ptotalErr").innerHTML='<p class="err">add a total amount to pay off</p>'; return; }
      var modeP=fd.get("pmode")||"manual";
      var amtP;
      if(modeP==="auto"){
        var termP=Math.max(1,Math.round(Number(fd.get("pterm"))||0));
        amtP=Math.round((totalP/termP)*100)/100;
      } else {
        amtP=cleanAmount(fd.get("amount")); amtP=amtP===""?0:amtP;
      }
      var existingBillIdx=id?findBill(id):-1;
      var existingLog=(existingBillIdx>=0&&state.bills[existingBillIdx].plan)?state.bills[existingBillIdx].plan.log:[];
      planObj={total:totalP,mode:modeP,termCycles:modeP==="auto"?termP:null,log:existingLog};
    }
    var b={id:id||uid(),name:name,cat:fd.get("cat")||"",freq:freqVal,amount:isPlan?amtP:cleanAmount(fd.get("amount")),due:fd.get("due")||"",start:freqVal==="One-Time"?(fd.get("start")||""):"",notes:String(fd.get("notes")||"").trim(),plan:planObj};
    var i=findBill(b.id); if(i>=0) state.bills[i]=b; else state.bills.push(b);
    closeSheet(); commit(); toast(id?"bill saved":"bill added 💅");
    return;
  }
  if(f.id==="paymentForm"){
    var bi=findBill(f.dataset.bill); if(bi<0) return;
    var bill=state.bills[bi]; if(!bill.plan) return;
    var amt2=cleanAmount(fd.get("amount")); if(amt2===""||amt2<=0) return;
    var ptype=fd.get("ptype")||"scheduled";
    var peffect=ptype==="extra"?(fd.get("peffect")||"same"):null;
    var entry={id:uid(),date:fd.get("date")||toISO(todayDays()),amount:amt2,note:String(fd.get("note")||"").trim(),type:ptype,effect:peffect,prevAmount:null};
    if(ptype==="extra"&&peffect==="lower"){
      var piBefore=planInfo(bill), oldAmt=num(bill.amount)||0;
      entry.prevAmount=oldAmt;
      var cyclesBefore=oldAmt>0?Math.ceil((piBefore.remaining/oldAmt)-1e-9):0;
      var remAfter=Math.max(0,Math.round((piBefore.remaining-amt2)*100)/100);
      if(cyclesBefore>0&&remAfter>0){ bill.amount=Math.round((remAfter/cyclesBefore)*100)/100; }
    }
    bill.plan.log.push(entry);
    commit();
    openSheet("edit bill",billForm(bill));
    toast(ptype==="extra"?"extra payment logged 💸 new per-cycle amount: "+$m(num(bill.amount)):"payment logged 💸");
    return;
  }
  if(f.id==="owedForm"){
    var who=String(fd.get("who")||"").trim();
    if(!who){ document.getElementById("whoErr").innerHTML='<p class="err">add a name so you know who this is</p>'; f.querySelector("[name=who]").focus(); return; }
    document.getElementById("whoErr").innerHTML="";
    var totalO=cleanAmount(fd.get("total")); totalO=totalO===""?0:totalO;
    var style=fd.get("style")||"lump";
    var planO=null;
    if(style==="plan"){ var instAmt=cleanAmount(fd.get("instamt")); planO={cycle:fd.get("cycle")||"Monthly",amount:instAmt===""?0:instAmt}; }
    var noDeadline=fd.get("nodeadline")==="on";
    var existingOwedIdx=id?findOwed(id):-1;
    var o={id:id||uid(),who:who,total:totalO,noDeadline:noDeadline,deadline:noDeadline?"":(fd.get("deadline")||""),notes:String(fd.get("notes")||"").trim(),plan:planO,
      log:existingOwedIdx>=0?state.owed[existingOwedIdx].log:[],extensions:existingOwedIdx>=0?state.owed[existingOwedIdx].extensions:[]};
    var oi=findOwed(o.id); if(oi>=0) state.owed[oi]=o; else state.owed.push(o);
    closeSheet(); commit(); toast(id?"updated":"added 🎀");
    return;
  }
  if(f.id==="owedPayForm"){
    var oidx=findOwed(f.dataset.owed); if(oidx<0) return;
    var amtR=cleanAmount(fd.get("amount")); if(amtR===""||amtR<=0) return;
    state.owed[oidx].log.push({id:uid(),date:fd.get("date")||toISO(todayDays()),amount:amtR,note:String(fd.get("note")||"").trim()});
    commit();
    openSheet(state.owed[oidx].who||"edit",owedForm(state.owed[oidx]));
    toast("payment logged 💸");
    return;
  }
  if(f.id==="owedExtForm"){
    var oidx2=findOwed(f.dataset.owed); if(oidx2<0) return;
    var nd=fd.get("newdeadline")||"";
    state.owed[oidx2].extensions.push({id:uid(),date:toISO(todayDays()),newDeadline:nd,note:String(fd.get("note")||"").trim()});
    state.owed[oidx2].deadline=nd; state.owed[oidx2].noDeadline=!nd;
    commit();
    openSheet(state.owed[oidx2].who||"edit",owedForm(state.owed[oidx2]));
    toast("deadline updated");
    return;
  }
});
sheetBody.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  if(t.id==="delBill"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="tap again to delete"; return; }
    var id=sheetBody.querySelector("#billForm").dataset.id;
    var i=findBill(id); if(i>=0) state.bills.splice(i,1);
    closeSheet(); commit(); toast("deleted");
    return;
  }
  if(t.id==="undoBillPay"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="tap again to undo"; return; }
    var bi2=findBill(t.dataset.bill); if(bi2<0) return;
    var bill2=state.bills[bi2]; if(!bill2.plan||!bill2.plan.log.length) return;
    var popped=bill2.plan.log.pop();
    if(popped&&popped.prevAmount!==null&&popped.prevAmount!==undefined) bill2.amount=popped.prevAmount;
    commit();
    openSheet("edit bill",billForm(bill2));
    toast("payment undone");
    return;
  }
  if(t.id==="delOwed"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="tap again to delete"; return; }
    var oid=sheetBody.querySelector("#owedForm").dataset.id;
    var oi=findOwed(oid); if(oi>=0) state.owed.splice(oi,1);
    closeSheet(); commit(); toast("deleted");
    return;
  }
  if(t.id==="undoOwedPay"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="tap again to undo"; return; }
    var oi2=findOwed(t.dataset.owed); if(oi2<0) return;
    state.owed[oi2].log.pop();
    commit();
    openSheet(state.owed[oi2].who||"edit",owedForm(state.owed[oi2]));
    toast("last payment undone");
    return;
  }
  if(t.id==="addCatBtn"){
    var inp=document.getElementById("newCatName"), nameC=inp.value.trim();
    if(!nameC){ inp.focus(); return; }
    if(state.categories.indexOf(nameC)>=0){ toast("that category already exists"); return; }
    state.categories.push(nameC); commit(); openSheet("edit categories",categoryManagerHtml()); toast("category added 🎀");
    return;
  }
  if(t.id==="saveCatRenames"){
    var rows=sheetBody.querySelectorAll(".catInput");
    var renameMap={}, newList=[], seen={};
    rows.forEach(function(inp){
      var orig=inp.dataset.catOrig, val=inp.value.trim()||orig;
      if(seen[val]) val=orig;
      seen[val]=true; newList.push(val);
      if(val!==orig) renameMap[orig]=val;
    });
    Object.keys(renameMap).forEach(function(orig){
      var to=renameMap[orig];
      state.bills.forEach(function(bb){ if(bb.cat===orig) bb.cat=to; });
    });
    state.categories=newList;
    closeSheet(); commit(); toast("categories updated 🎀");
    return;
  }
  if(t.dataset.delCat){
    var cname=t.dataset.delCat;
    if(state.categories.length<=1){ toast("keep at least one category"); return; }
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="tap again"; return; }
    var fallback=state.categories.filter(function(c){return c!==cname;})[0];
    state.bills.forEach(function(bb){ if(bb.cat===cname) bb.cat=fallback; });
    state.categories=state.categories.filter(function(c){return c!==cname;});
    commit(); openSheet("edit categories",categoryManagerHtml()); toast("category deleted");
    return;
  }
});
document.getElementById("sheetClose").addEventListener("click",closeSheet);
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });

/* ---------- page-level events ---------- */
document.querySelector(".tabbar").addEventListener("click",function(e){ var b=e.target.closest("button[data-tab]"); if(b) showTab(b.dataset.tab); });
document.querySelector("main").addEventListener("click",function(e){
  var el=e.target.closest("button"); if(!el) return;
  if(el.id==="shuffle"){ var n; do{ n=Math.floor(Math.random()*AFFIRMATIONS.length);}while(n===affIdx&&AFFIRMATIONS.length>1); affIdx=n; render(); return; }
  if(el.hasAttribute("data-new-bill")) return openSheet("add a bill",billForm(null));
  if(el.dataset.editBill){ var i=findBill(el.dataset.editBill); if(i>=0) openSheet("edit bill",billForm(state.bills[i])); return; }
  if(el.hasAttribute("data-manage-cats")) return openSheet("edit categories",categoryManagerHtml());
  if(el.hasAttribute("data-new-owed")) return openSheet("someone owes you",owedForm(null));
  if(el.dataset.editOwed){ var oIdx=findOwed(el.dataset.editOwed); if(oIdx>=0) openSheet("edit what's owed",owedForm(state.owed[oIdx])); return; }
  if(el.dataset.moneyview){ moneyView=el.dataset.moneyview; document.getElementById("s-money").innerHTML=renderMoney(derive()); return; }
  if(el.dataset.go==="money-owed"){ moneyView="owed"; showTab("money"); return; }
  if(el.dataset.go) showTab(el.dataset.go);
  if(el.id==="copyBackup"){
    var code=JSON.stringify({app:"bills-bestie",v:2,bills:state.bills,paycheck:state.paycheck,hrt:state.hrt,categories:state.categories,owed:state.owed});
    var done=function(){ toast("backup copied, paste it in Notes 💾"); };
    var manual=function(){ document.getElementById("backupOut").innerHTML='<div class="field" style="margin-top:10px"><label for="bk">select all and copy this</label><textarea id="bk" readonly></textarea></div>'; var t=document.getElementById("bk"); t.value=code; t.focus(); t.select(); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,manual); } else manual();
    return;
  }
  if(el.id==="doRestore"){
    var msg=document.getElementById("restoreMsg"), raw=document.getElementById("restoreText").value.trim();
    var data=null; try{ data=JSON.parse(raw); }catch(err){}
    if(!data||!Array.isArray(data.bills)){ msg.innerHTML='<p class="err" style="margin-top:8px">that doesn\'t look like a backup from this app. copy the whole thing and try again.</p>'; return; }
    if(!el.dataset.armed){ el.dataset.armed="1"; el.textContent="tap again to replace everything"; msg.innerHTML='<p class="note" style="margin-top:8px">found '+data.bills.length+' bill'+(data.bills.length===1?'':'s')+'. restoring replaces what\'s in the app now.</p>'; return; }
    state=normalize(data); commit(); toast("backup restored ✨");
  }
});
var payTimer=null;
document.querySelector("main").addEventListener("input",function(e){
  if(e.target.id!=="pay") return;
  var v=cleanAmount(e.target.value); state.paycheck=v===""?0:v;
  writeCache(); render();
  clearTimeout(payTimer); payTimer=setTimeout(function(){ state.updatedAt=new Date().toISOString(); writeCache(); },700);
});
document.querySelector("main").addEventListener("focusout",function(e){ if(e.target.id==="pay") setTimeout(render,0); });

/* re-check dates when the app comes back to the foreground (e.g. the next morning) */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden") return;
  if(!sheet.classList.contains("on")) render();
});

render();
})();
</script>
</body>
