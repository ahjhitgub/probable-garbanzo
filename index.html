<style>
:root{--bg:#fff;--fg:#000;--muted:#6b6b6b;--line:#e3e3e3;--font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}

.btn.ghost{background:transparent;color:var(--fg)}

.link{background:none;border:0;padding:0;color:var(--fg);font-size:inherit;font-weight:500;text-decoration:underline;text-underline-offset:3px}

.list,.alerts{border-top:1px solid var(--line)}
.item,.alert{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);border-radius:0}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="logic">
/* ---------- lists ---------- */
var DEFAULT_CATS=["Housing/Rent","Utilities","Insurance","Subscriptions","Debt/Loans","Medical","Transportation","Groceries/Essentials","Personal","Other"];
var FREQ={"Weekly":{months:0,days:7},"Biweekly":{months:0,days:14},"Monthly":{months:1,days:0},"Quarterly":{months:3,days:0},"Semi-Annually":{months:6,days:0},"Annually":{months:12,days:0},"One-Time":{months:0,days:0}};

/* ---------- date math, in whole days ---------- */
var DAY=86400000;
function toDays(s){ if(!s) return null; var p=String(s).split("-").map(Number); if(p.length<3||!p[0]) return null; return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY); }
function parts(n){ var d=new Date(n*DAY); return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),dow:d.getUTCDay()}; }
function toISO(n){ var p=parts(n); return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
function todayDays(){ var t=new Date(); return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY); }
function wd(n){ return ((parts(n).dow+6)%7)+1; }            /* Mon=1 ... Sun=7 */
function mod(a,n){ return ((a%n)+n)%n; }
function edate(n,k){ var p=parts(n); var tot=p.y*12+(p.m-1)+k; var ny=Math.floor(tot/12), nm=tot-ny*12; var last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate(); return Math.round(Date.UTC(ny,nm,Math.min(p.d,last))/DAY); }
function monthsBetween(a,b){ var A=parts(a),B=parts(b); var m=(B.y-A.y)*12+(B.m-A.m); if(B.d<A.d) m--; return Math.max(0,m); }
function wedOnOrBefore(n){ return n-mod(wd(n)-3,7); }
function wedOnOrAfter(n){ return n+mod(3-wd(n),7); }
function num(v){ if(v===""||v===null||v===undefined) return null; var x=Number(v); return isFinite(x)?x:null; }

/* ---------- per-bill engine ---------- */
/* A Wednesday payday counts as saved starting the day after it (Thursday). */
function computeBill(b,T){
  var out={next:null,saveBy:null,weeksLeft:null,weekly:null,saved:null,needed:null,pct:null,status:null,key:null,missingStart:false};
  if(!b||!b.name) return out;
  var due=toDays(b.due); if(due===null) return out;
  var iv=FREQ[b.freq]; if(!iv) iv={months:0,days:0};
  var oneTime=b.freq==="One-Time";
  var C=0;
  if(!oneTime && T>due){
    if(iv.days>0){
      C=Math.max(0,Math.ceil((T-due)/iv.days));
    } else if(iv.months>0){
      var B=monthsBetween(due,T), q=Math.floor(B/iv.months);
      C=q+(edate(due,q*iv.months)<T?1:0);
    }
  }
  var D=oneTime?due:(iv.days>0?due+C*iv.days:edate(due,C*iv.months));
  var E=wedOnOrBefore(D);
  var G=null;
  if(oneTime){ var S=toDays(b.start); G=S===null?null:wedOnOrAfter(S); if(S===null) out.missingStart=true; }
  else { var F=iv.days>0?D-iv.days:edate(D,-iv.months); G=wedOnOrBefore(F)+7; }
  var V=wedOnOrAfter(T);
  var I=Math.max(0,(E-V)/7+1);
  out.next=D; out.saveBy=E; out.weeksLeft=I;
  var amt=num(b.amount);
  var M=null;
  if(G!==null && amt!==null){
    var H=Math.max(1,(E-G)/7+1);
    var J=amt/H, K=Math.max(0,H-I);
    var L=Math.min(amt,J*K);
    M=Math.max(0,amt-L);
    out.saved=L; out.needed=M; out.pct=amt>0?L/amt:null;
    out.weekly=M===0?0:(I<=1?M:Math.min(J,M));
  }
  if(M===0){out.status="Funded";out.key="funded";}
  else if(D<T){out.status="Overdue";out.key="overdue";}
  else if(I<=1){out.status="Due this week";out.key="week";}
  else if(I<=2){out.status="Due soon";out.key="soon";}
  else {out.status="On track";out.key="track";}
  return out;
}
</script>

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
var LS_KEY="bill-tracker-v2", OLD_KEYS=["bestie-bill-tracker-v1"], TAB_KEY="bill-tracker-tab";
var tab="home", moneyView="owe", renderedDay=null;

function own(o,k){ return o!==null&&o!==undefined&&Object.prototype.hasOwnProperty.call(o,k); }
function cleanLabel(s){ var t=String(s).replace(/^[^\p{L}\p{N}(]+/u,"").trim(); return t||String(s).trim(); }

/* one-time cleanup of data saved by the previous version */
var LEGACY_RENAME={"💊 Medical/HRT":"Medical","🎉 Fun/Personal":"Personal","✨ Other/Misc":"Other"};
var LEGACY_DROP=["🩺 Gender-Affirming Care","🎀 Wardrobe/Closet","💅 Self-Care/Beauty","📄 Legal (Name/ID Change)"];
function migrateLegacy(d){
  var bills=Array.isArray(d.bills)?d.bills.filter(Boolean):[];
  var used={}; bills.forEach(function(b){ if(b.cat) used[b.cat]=true; });
  var rename={}, cats=[];
  (Array.isArray(d.categories)?d.categories:[]).forEach(function(c){
    if(!c) return;
    if(LEGACY_DROP.indexOf(c)>=0&&!own(used,c)) return;
    var n=own(LEGACY_RENAME,c)?LEGACY_RENAME[c]:cleanLabel(c);
    if(n!==c) rename[c]=n;
    if(cats.indexOf(n)<0) cats.push(n);
  });
  bills.forEach(function(b){
    if(own(rename,b.cat)) b.cat=rename[b.cat];
    if((b.id==="ex1"||b.id==="ex2")&&typeof b.name==="string") b.name=b.name.replace(/^🌟\s*/,"");
  });
  d.bills=bills; d.categories=cats; delete d.hrt;
  return d;
}
function normalize(d){
  d=(d&&typeof d==="object")?d:{};
  if(d.schema!==2) d=migrateLegacy(d);
  var bills=(Array.isArray(d.bills)?d.bills.filter(Boolean):[]).map(function(b){ if(b.plan) b.plan.log=Array.isArray(b.plan.log)?b.plan.log:[]; return b; });
  var owed=(Array.isArray(d.owed)?d.owed.filter(Boolean):[]).map(function(o){ o.log=Array.isArray(o.log)?o.log:[]; o.extensions=Array.isArray(o.extensions)?o.extensions:[]; return o; });
  var cats=Array.isArray(d.categories)?d.categories.filter(Boolean):[];
  if(!cats.length) cats=DEFAULT_CATS.slice();
  var groups=Array.isArray(d.groups)?d.groups.filter(Boolean):[];
  var catGroup={};
  if(d.catGroup&&typeof d.catGroup==="object") cats.forEach(function(c){ if(own(d.catGroup,c)&&groups.indexOf(d.catGroup[c])>=0) catGroup[c]=d.catGroup[c]; });
  return {schema:2,bills:bills,owed:owed,paycheck:num(d.paycheck)||0,updatedAt:d.updatedAt||null,categories:cats,groups:groups,catGroup:catGroup};
}
function readCache(){
  var keys=[LS_KEY].concat(OLD_KEYS);
  for(var i=0;i<keys.length;i++){
    try{ var s=localStorage.getItem(keys[i]); if(s) return normalize(JSON.parse(s)); }catch(e){}
  }
  return null;
}
function writeCache(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
var state=readCache()||normalize({schema:2});
try{ var t0=localStorage.getItem(TAB_KEY); if(t0) tab=t0; }catch(e){}
function commit(){ state.updatedAt=new Date().toISOString(); writeCache(); render(); }

/* ---------- payment plans + owed-to-me ---------- */
function planInfo(b){
  if(!b||!b.plan) return null;
  var p=b.plan, total=num(p.total)||0, paid=0;
  (p.log||[]).forEach(function(e){ var a=num(e.amount); if(a) paid+=a; });
  paid=Math.round(paid*100)/100;
  var remaining=Math.max(0,Math.round((total-paid)*100)/100);
  var amt=num(b.amount)||0;
  var cyclesLeft=amt>0?Math.max(0,Math.ceil(remaining/amt-1e-9)):null;
  var complete=total>0&&remaining<=0.005;
  return {total:total,paid:paid,remaining:remaining,cyclesLeft:cyclesLeft,complete:complete};
}
function findBill(id){ for(var i=0;i<state.bills.length;i++) if(state.bills[i].id===id) return i; return -1; }
function findOwed(id){ for(var i=0;i<state.owed.length;i++) if(state.owed[i].id===id) return i; return -1; }
function owedPaid(o){ var s=0; (o.log||[]).forEach(function(e){ var a=num(e.amount); if(a) s+=a; }); return Math.round(s*100)/100; }
function owedStatus(o,T){
  var total=num(o.total)||0, paid=owedPaid(o), remaining=Math.max(0,Math.round((total-paid)*100)/100);
  var complete=total>0&&remaining<=0.005;
  var dueDays=(!o.noDeadline&&o.deadline)?toDays(o.deadline):null;
  var status,key;
  if(complete){ status="Paid back"; key="funded"; }
  else if(dueDays===null){ status="No deadline"; key="track"; }
  else if(dueDays<T){ status="Overdue"; key="overdue"; }
  else if(dueDays-T<=7){ status="Due soon"; key="week"; }
  else { status="On track"; key="track"; }
  return {total:total,paid:paid,remaining:remaining,complete:complete,status:status,key:key,dueDays:dueDays};
}

/* ---------- formatting ---------- */
var money=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function $m(v){ return v===null||v===undefined?"—":money.format(v); }
function r2(x){ return Math.round(x*100)/100+0; }
function clamp01(x){ return Math.max(0,Math.min(1,x||0)); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], WDS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fdate(n,withDow){ if(n===null||n===undefined) return "—"; var p=parts(n), T=parts(todayDays()); return (withDow?WDS[p.dow]+", ":"")+MON[p.m-1]+" "+p.d+(p.y!==T.y?", "+p.y:""); }
function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function plural(n,w){ return n+" "+w+(n===1?"":"s"); }
function people(n){ return n===1?"1 person":n+" people"; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2200); }
function pv(a,b){ return '<div><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>'; }
function meterHtml(pct,left,right){ pct=clamp01(pct); return '<div class="meter" role="img" aria-label="'+Math.round(pct*100)+' percent"><i style="width:'+(pct*100).toFixed(1)+'%"></i></div><div class="meterlbl"><span>'+esc(left)+'</span>'+(right?'<span>'+esc(right)+'</span>':'')+'</div>'; }
function groupOf(c){ return own(state.catGroup,c)?state.catGroup[c]:""; }

/* ---------- derived numbers ---------- */
function blank(){ return {weekly:0,saved:0,needed:0,count:0}; }
function addTo(t,c){ t.count++; if(c.weekly!==null) t.weekly+=c.weekly; if(c.saved!==null) t.saved+=c.saved; if(c.needed!==null) t.needed+=c.needed; }
function sumInto(t,s){ t.count+=s.count; t.weekly+=s.weekly; t.saved+=s.saved; t.needed+=s.needed; }
function derive(){
  var T=todayDays();
  var bills=state.bills.map(function(b){
    var c=computeBill(b,T);
    if(b.plan){ var pi=planInfo(b); if(pi&&pi.complete){ c.weekly=0; c.needed=0; c.status="Paid off"; c.key="funded"; } }
    return {b:b,c:c};
  });
  bills.sort(function(x,y){ var a=x.c.next, b=y.c.next; if(a===null&&b===null) return 0; if(a===null) return 1; if(b===null) return -1; return a-b; });
  var tot={amount:0,weekly:0,saved:0,needed:0};
  var cats={}; state.categories.forEach(function(k){ cats[k]=blank(); });
  var unc=blank();
  bills.forEach(function(x){
    var a=num(x.b.amount); if(a!==null) tot.amount+=a;
    if(x.c.weekly!==null) tot.weekly+=x.c.weekly;
    if(x.c.saved!==null) tot.saved+=x.c.saved;
    if(x.c.needed!==null) tot.needed+=x.c.needed;
    addTo(own(cats,x.b.cat)?cats[x.b.cat]:unc,x.c);
  });
  var groups=state.groups.map(function(g){
    var t=blank(); t.name=g;
    t.cats=state.categories.filter(function(c){ return groupOf(c)===g; });
    t.cats.forEach(function(c){ sumInto(t,cats[c]); });
    return t;
  });
  var loose=blank();
  loose.cats=state.categories.filter(function(c){ return !groupOf(c); });
  loose.cats.forEach(function(c){ sumInto(loose,cats[c]); });
  sumInto(loose,unc);
  var pay=num(state.paycheck)||0;
  return {T:T,bills:bills,tot:tot,cats:cats,unc:unc,groups:groups,loose:loose,pay:pay,left:r2(pay-tot.weekly),payday:wedOnOrAfter(T)};
}
function buildAlerts(d){
  var out=[];
  d.bills.forEach(function(x){
    var b=x.b,c=x.c; if(!c.key) return;
    if(c.missingStart) out.push({l:2,t:"Add a saving start date for "+b.name,s:"One-time bills need one to calculate weekly savings.",bill:b.id});
    if(c.key==="overdue") out.push({l:0,t:b.name+" is overdue",s:"Was due "+fdate(c.next,true)+"."+(c.needed!==null?" "+$m(c.needed)+" still needed.":""),bill:b.id});
    else if(c.key==="week") out.push({l:1,t:b.name+" is due this week",s:"Have "+$m(c.needed)+" ready by "+fdate(c.saveBy,true)+". Due "+fdate(c.next,true)+".",bill:b.id});
    else if(c.key==="soon") out.push({l:2,t:b.name+" is due soon",s:"Save by "+fdate(c.saveBy,true)+". "+$m(c.needed)+" to go.",bill:b.id});
  });
  if(d.pay>0&&d.left<0) out.push({l:1,t:"Bills need more than your paycheck",s:"Short "+$m(-d.left)+" per week.",tab:"money"});
  (state.owed||[]).forEach(function(o){
    var s=owedStatus(o,d.T); if(s.complete) return;
    if(s.key==="overdue") out.push({l:1,t:(o.who||"Someone")+" owes you "+$m(s.remaining),s:"Was due "+fdate(s.dueDays,true)+".",owed:o.id});
    else if(s.key==="week") out.push({l:2,t:"Payment from "+(o.who||"someone")+" due soon",s:$m(s.remaining)+" due by "+fdate(s.dueDays,true)+".",owed:o.id});
  });
  out.sort(function(a,b){ return a.l-b.l; });
  return out;
}

/* ---------- screens ---------- */
function alertRow(a){
  var attrs=a.bill?' data-edit-bill="'+esc(a.bill)+'"':a.owed?' data-edit-owed="'+esc(a.owed)+'"':' data-go="'+esc(a.tab)+'"';
  return '<button class="alert l'+a.l+'"'+attrs+'><span class="at">'+esc(a.t)+'</span><span class="as">'+esc(a.s)+'</span></button>';
}
function renderHome(d,alerts){
  var p=parts(d.T), isWed=d.T===d.payday;
  var h='<div class="head"><div><h1>Home</h1><p class="sub">'+WDL[p.dow]+", "+MON[p.m-1]+" "+p.d+'</p></div></div>';
  h+='<h2>Needs attention</h2>';
  h+=alerts.length?'<div class="alerts">'+alerts.map(alertRow).join("")+'</div>':'<div class="empty">Nothing overdue or due this week.</div>';
  h+='<h2>'+(isWed?"Payday · Today":"Next payday · "+fdate(d.payday,true))+'</h2>';
  h+='<div class="big num">'+$m(d.tot.weekly)+'</div><p class="sub">to set aside for bills'+(d.pay>0?' · '+$m(d.left)+' left over':'')+'</p>';
  var rows=[];
  if(state.groups.length){
    d.groups.forEach(function(g){ if(g.weekly>0) rows.push([g.name,g.weekly]); });
    if(d.loose.weekly>0) rows.push(["Not grouped",d.loose.weekly]);
  } else {
    d.bills.forEach(function(x){ if(x.c.weekly) rows.push([x.b.name,x.c.weekly]); });
  }
  if(rows.length) h+='<div class="ledger">'+rows.map(function(r){ return '<div><span>'+esc(r[0])+'</span><span class="num">'+$m(r[1])+'</span></div>'; }).join("")+'</div>';
  var open=(state.owed||[]).filter(function(o){ return !owedStatus(o,d.T).complete; });
  if(open.length){
    var sum=open.reduce(function(s,o){ return s+owedStatus(o,d.T).remaining; },0);
    h+='<h2>Owed to you</h2><div class="list"><button class="item" data-go="money-owed"><div class="top"><span>'+(open.length===1?"1 person owes you":open.length+" people owe you")+'</span><span class="num amt">'+$m(sum)+'</span></div></button></div>';
  }
  return h;
}
function billCard(x){
  var b=x.b,c=x.c,pct=c.pct===null?0:clamp01(c.pct);
  var h='<button class="item" data-edit-bill="'+esc(b.id)+'"><div class="top"><span class="name">'+esc(b.name)+'</span><span class="amt num">'+$m(num(b.amount))+'</span></div>';
  var meta=[]; if(b.cat) meta.push(esc(b.cat)); if(b.freq) meta.push(esc(b.freq)); if(b.plan) meta.push("Payment plan");
  h+='<div class="meta">'+(c.key?'<span class="chip k-'+c.key+'">'+esc(c.status)+'</span>':'')+'<span>'+meta.join(" · ")+'</span></div>';
  if(c.missingStart) h+='<p class="hint">Add a saving start date to calculate weekly savings.</p>';
  if(c.next===null){ h+='<p class="hint">Add a due date.</p>'; }
  else {
    h+='<div class="facts"><div><small>Next due</small><span>'+fdate(c.next,true)+'</span></div><div><small>Save by</small><span>'+fdate(c.saveBy,true)+'</span></div>';
    h+='<div><small>Weeks left</small><span>'+(c.weeksLeft===null?"—":c.weeksLeft)+'</span></div><div><small>Weekly</small><span>'+$m(c.weekly)+'</span></div></div>';
    h+=meterHtml(pct,c.pct===null?"—":Math.round(pct*100)+"% funded",$m(c.saved)+" saved · "+$m(c.needed)+" needed");
  }
  if(b.plan){
    var pi=planInfo(b), ppct=pi.total>0?pi.paid/pi.total:0;
    h+='<div class="facts" style="margin-top:12px"><div><small>Total payoff</small><span>'+$m(pi.total)+'</span></div><div><small>Remaining</small><span>'+$m(pi.remaining)+'</span></div>';
    h+='<div><small>Paid so far</small><span>'+$m(pi.paid)+'</span></div><div><small>Cycles left (est.)</small><span>'+(pi.cyclesLeft===null?"—":pi.cyclesLeft)+'</span></div></div>';
    h+=meterHtml(ppct,Math.round(clamp01(ppct)*100)+"% paid off"+(pi.complete?" · Paid in full":""),"");
  }
  if(b.notes) h+='<p class="notes">'+esc(b.notes)+'</p>';

function renderBills(d){
  var h='<div class="head"><div><h1>Bills</h1><p class="sub">'+plural(d.bills.length,"bill")+' · <button class="link" data-manage-cats>Categories</button></p></div><button class="btn" data-new-bill>Add bill</button></div>';
  h+='<div class="stats"><div class="stat"><small>Total bills</small><strong>'+$m(d.tot.amount)+'</strong></div><div class="stat"><small>Weekly to save</small><strong>'+$m(d.tot.weekly)+'</strong></div><div class="stat"><small>Saved so far</small><strong>'+$m(d.tot.saved)+'</strong></div><div class="stat"><small>Still needed</small><strong>'+$m(d.tot.needed)+'</strong></div></div>';
  h+='<p class="note" style="margin:10px 0 0">Saved amounts assume the weekly amount was set aside each payday, counted through '+fdate(d.payday-7,true)+'.</p>';

}
function renderMoney(d){
  var h='<div class="head"><div><h1>Money</h1></div></div>';
  h+='<div class="switch" role="group" aria-label="View"><button type="button" data-moneyview="owe" aria-pressed="'+(moneyView==="owe")+'">You owe</button><button type="button" data-moneyview="owed" aria-pressed="'+(moneyView==="owed")+'">Owed to you</button></div>';

function payLedger(d){
  var h='<div id="payLedger"><div class="ledger"><div><span>Weekly savings, all bills</span><span class="num">'+$m(d.tot.weekly)+'</span></div><div class="strong"><span>Left each week</span><span class="num">'+$m(d.left)+'</span></div></div>';
  if(d.pay>0&&d.left<0) h+='<p class="warn">Bills need '+$m(-d.left)+' more than this paycheck.</p>';
  return h+'</div>';
}
function catTable(d){
  var hasGroups=state.groups.length>0;
  var row=function(cls,label,t){ return '<tr class="'+cls+'"><td>'+esc(label)+'</td><td>'+$m(t.weekly)+'</td><td>'+$m(t.saved)+'</td><td>'+$m(t.needed)+'</td></tr>'; };
  var body="";
  d.groups.forEach(function(g){
    body+=row("grp",g.name,g);
    g.cats.forEach(function(c){ if(d.cats[c].count) body+=row("sub",c,d.cats[c]); });
  });
  var looseRows="";
  d.loose.cats.forEach(function(c){ if(d.cats[c].count) looseRows+=row(hasGroups?"sub":"",c,d.cats[c]); });
  if(d.unc.count) looseRows+=row(hasGroups?"sub":"","Uncategorized",d.unc);
  if(looseRows){ if(hasGroups) body+=row("grp","Not grouped",d.loose); body+=looseRows; }
  body+=row("total","Total",d.tot);
  return '<div class="scroll"><table class="cattable"><thead><tr><th>'+(hasGroups?"Main category":"Category")+'</th><th>Weekly</th><th>Saved</th><th>Needed</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function renderOweSection(d){
  var h='<label class="lbl" for="pay">Weekly paycheck</label><div class="payin"><span>$</span><input id="pay" inputmode="decimal" type="text" autocomplete="off" placeholder="0.00" value="'+(d.pay?esc(d.pay):"")+'"></div>';
  h+=payLedger(d);
  h+='<h2>'+(state.groups.length?"By main category":"By category")+'</h2>';
  if(!state.groups.length) h+='<p class="note">Group categories into main categories to see combined totals. <button class="link" data-manage-cats>Set up</button></p>';
  h+=d.bills.length?catTable(d):'<div class="empty">Add bills to see totals here.</div>';
  var when=state.updatedAt?new Date(state.updatedAt):null;
  if(when&&!isNaN(when)) h+='<p class="note" style="margin-top:16px">Last edited '+when.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+'</p>';
  return h;
}
function renderOwedSection(d){
  var list=state.owed||[];
  var sorted=list.map(function(o){ return {o:o,s:owedStatus(o,d.T)}; }).sort(function(a,b){
    if(a.s.complete!==b.s.complete) return a.s.complete?1:-1;
    var ad=a.s.dueDays,bd=b.s.dueDays;
    if(ad===null&&bd===null) return 0; if(ad===null) return 1; if(bd===null) return -1; return ad-bd;
  });
  var rem=0,paid=0; sorted.forEach(function(x){ rem+=x.s.remaining; paid+=x.s.paid; });
  var h='<div class="stats"><div class="stat"><small>Still owed to you</small><strong>'+$m(rem)+'</strong></div><div class="stat"><small>Received</small><strong>'+$m(paid)+'</strong></div></div>';
  h+='<div class="top" style="align-items:center;margin-top:20px"><span class="sub" style="margin:0">'+people(list.length)+'</span><button class="btn" data-new-owed>Add</button></div>';
  h+=sorted.length?'<div class="list" style="margin-top:12px">'+sorted.map(function(x){ return owedCard(x.o,x.s); }).join("")+'</div>':'<div class="empty" style="margin-top:12px">No one owes you money right now.</div>';
  return h;
}
function owedCard(o,s){
  var pct=s.total>0?s.paid/s.total:0;
  var h='<button class="item" data-edit-owed="'+esc(o.id)+'"><div class="top"><span class="name">'+esc(o.who||"(no name)")+'</span><span class="amt num">'+$m(s.remaining)+'</span></div>';
  h+='<div class="meta"><span class="chip k-'+s.key+'">'+esc(s.status)+'</span>'+(o.plan?'<span>Installments</span>':'')+'</div>';
  h+='<div class="facts"><div><small>Total owed</small><span>'+$m(s.total)+'</span></div><div><small>Received</small><span>'+$m(s.paid)+'</span></div>';
  h+='<div><small>Deadline</small><span>'+(s.dueDays===null?"None":fdate(s.dueDays,true))+'</span></div><div><small>Remaining</small><span>'+$m(s.remaining)+'</span></div></div>';
  h+=meterHtml(pct,Math.round(clamp01(pct)*100)+"% paid back","");
  if(o.notes) h+='<p class="notes">'+esc(o.notes)+'</p>';
  return h+'</button>';
}

function render(){
  var d=derive(), alerts=buildAlerts(d);
  renderedDay=d.T;
  var urgent=alerts.filter(function(a){ return a.l<=1; }).length;
  var badge=document.getElementById("badge");
  if(urgent){ badge.textContent=urgent; badge.hidden=false; } else badge.hidden=true;
  var active=document.activeElement, keepPay=active&&active.id==="pay";
  document.getElementById("s-home").innerHTML=renderHome(d,alerts);
  document.getElementById("s-bills").innerHTML=renderBills(d);
  if(!keepPay) document.getElementById("s-money").innerHTML=renderMoney(d);
  else refreshMoneyLive(d);
  var g=document.getElementById("s-guide"); if(!g.innerHTML) g.innerHTML=renderGuide();
  showTab(tab,true);
}
function refreshMoneyLive(d){
  var old=document.getElementById("payLedger"); if(!old) return;
  var tmp=document.createElement("div"); tmp.innerHTML=payLedger(d);
  old.replaceWith(tmp.firstChild);
}
function refreshIfNewDay(){ if(todayDays()!==renderedDay) render(); }
function showTab(t,silent){
  if(!document.getElementById("s-"+t)) t="home";
  tab=t;
  try{ localStorage.setItem(TAB_KEY,t); }catch(e){}
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("on",s.id==="s-"+t); });
  document.querySelectorAll(".tabbar button").forEach(function(b){ b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"); });
  if(!silent) window.scrollTo(0,0);
}

/* ---------- sheet ---------- */
var sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"), sheetBody=document.getElementById("sheetBody");
function openSheet(title,html){ document.getElementById("sheetTitle").textContent=title; sheetBody.innerHTML=html; sheet.classList.add("on"); scrim.classList.add("on"); sheetBody.scrollTop=0; }
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); refreshIfNewDay(); }
function opts(list,sel){ return list.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join(""); }
function catOption(c,sel){ return '<option value="'+esc(c)+'"'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }
function catOptions(sel){
  var h='<option value="">No category</option>', used={};
  state.groups.forEach(function(g){
    var cs=state.categories.filter(function(c){ return groupOf(c)===g; });
    if(!cs.length) return;
    h+='<optgroup label="'+esc(g)+'">'+cs.map(function(c){ used[c]=true; return catOption(c,sel); }).join("")+'</optgroup>';
  });
  var rest=state.categories.filter(function(c){ return !own(used,c); });
  if(rest.length) h+=(state.groups.length?'<optgroup label="Not grouped">':'')+rest.map(function(c){ return catOption(c,sel); }).join("")+(state.groups.length?'</optgroup>':'');
  if(sel&&state.categories.indexOf(sel)<0) h+=catOption(sel,sel);
  return h;
}
function cleanAmount(v){ v=String(v||"").replace(/[$,\s]/g,""); if(v==="") return ""; var n=Number(v); return isFinite(n)?Math.round(n*100)/100:""; }

    }
    if(!pi.complete){
      h+='<form id="paymentForm" data-bill="'+esc(b.id)+'" novalidate><h3>Log a payment</h3><div class="two"><div class="field"><label for="p-amt">Amount</label><input id="p-amt" name="amount" inputmode="decimal" placeholder="0.00"></div><div class="field"><label for="p-date">Date</label><input id="p-date" name="date" type="date" value="'+toISO(todayDays())+'"></div></div>';
      h+='<div class="field"><span class="lbl">Type</span><div class="opts"><label class="opt"><input type="radio" name="ptype" value="scheduled" checked> Regular</label><label class="opt"><input type="radio" name="ptype" value="extra"> Extra / early</label></div></div>';

  }

}

function categoryManagerHtml(){

function refreshGroupSelects(){
  var gs=[];
  sheetBody.querySelectorAll("#grpList .mrow").forEach(function(r){
    if(r.classList.contains("removed")) return;
    var v=r.querySelector(".grpInput").value.trim();
    gs.push({key:r.dataset.gkey,name:v||"(unnamed)"});
  });
  sheetBody.querySelectorAll(".catGroupSel").forEach(function(s){
    var want=s.dataset.sel||"";
    s.innerHTML='<option value="">No main category</option>'+gs.map(function(g){ return '<option value="'+esc(g.key)+'">'+esc(g.name)+'</option>'; }).join("");

  });
}
function openCategories(){ openSheet("Categories",categoryManagerHtml()); refreshGroupSelects(); }

  h+='<div class="field"><label class="chk"><input type="checkbox" id="o-nodl" name="nodeadline"'+(o.noDeadline?" checked":"")+'> No deadline</label></div>';

  if(!isNew){

    if((o.extensions||[]).length){
      h+='<h3>Deadline extensions</h3><div class="ledger" style="margin-top:0">'+o.extensions.slice().reverse().map(function(e){ return '<div><span>'+fdate(toDays(e.date),false)+(e.note?" · "+esc(e.note):"")+'</span><span class="num">'+(e.newDeadline?fdate(toDays(e.newDeadline),true):"No deadline")+'</span></div>'; }).join("")+'</div>';

sheetBody.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f-freq"){ var sw=document.getElementById("startWrap"); if(sw) sw.hidden=t.value!=="One-Time"; }
  if(t.id==="f-isplan"||t.name==="pmode"){
    var isPlanEl=document.getElementById("f-isplan");
    if(isPlanEl){
      var isPlan=isPlanEl.checked;
      var modeEl=sheetBody.querySelector('input[name="pmode"]:checked');
      var isAuto=isPlan&&modeEl&&modeEl.value==="auto";
      var pf=document.getElementById("planFields"); if(pf) pf.hidden=!isPlan;
      var pt=document.getElementById("ptermWrap"); if(pt) pt.hidden=!isAuto;
      var aw=document.getElementById("amtWrap"); if(aw){ aw.hidden=isAuto; var lbl=aw.querySelector("label"); if(lbl) lbl.textContent=isPlan?"Payment per cycle":"Amount"; }
      var fl=document.querySelector('label[for="f-freq"]'); if(fl) fl.textContent=isPlan?"Payment cycle":"Frequency";
      var dl=document.getElementById("dueLbl"); if(dl) dl.textContent=isPlan?"Next payment due":"Due date";
    }
  }
  if(t.name==="ptype"){ var pe=document.getElementById("peffWrap"); if(pe) pe.hidden=t.value!=="extra"; }
  if(t.id==="o-nodl"){ var dw=document.getElementById("dlWrap"); if(dw) dw.hidden=t.checked; }
  if(t.name==="style"){ var pw=document.getElementById("planWrap"); if(pw) pw.hidden=t.value!=="plan"; }

});
sheetBody.addEventListener("input",function(e){
  if(e.target.classList&&e.target.classList.contains("grpInput")) refreshGroupSelects();
});
sheetBody.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target, fd=new FormData(f), id=f.dataset.id;
  if(f.id==="billForm"){
    var name=String(fd.get("name")||"").trim(), nameErr=document.getElementById("nameErr");
    if(!name){ nameErr.innerHTML='<p class="err">Add a name.</p>'; f.querySelector("[name=name]").focus(); return; }
    nameErr.innerHTML="";
    var isPlan=fd.get("isplan")==="on";
    var freqVal=fd.get("freq")||"Monthly";
    var freqErr=document.getElementById("freqErr"), ptotalErr=document.getElementById("ptotalErr");
    freqErr.innerHTML=""; ptotalErr.innerHTML="";
    if(isPlan&&freqVal==="One-Time"){ freqErr.innerHTML='<p class="err">Payment plans need a repeating cycle. Choose a frequency other than One-Time.</p>'; return; }
    var planObj=null, amtP=0, termP=null;
    if(isPlan){
      var totalP=cleanAmount(fd.get("ptotal"));
      if(totalP===""||totalP<=0){ ptotalErr.innerHTML='<p class="err">Add the total amount to pay off.</p>'; return; }
      var modeP=fd.get("pmode")||"manual";
      if(modeP==="auto"){ termP=Math.max(1,Math.round(Number(fd.get("pterm"))||0)); amtP=Math.round(totalP/termP*100)/100; }
      else { amtP=cleanAmount(fd.get("amount")); if(amtP==="") amtP=0; }
      var ei=id?findBill(id):-1;
      var existingLog=(ei>=0&&state.bills[ei].plan)?state.bills[ei].plan.log:[];
      planObj={total:totalP,mode:modeP,termCycles:modeP==="auto"?termP:null,log:existingLog};
    }
    var b={id:id||uid(),name:name,cat:fd.get("cat")||"",freq:freqVal,amount:isPlan?amtP:cleanAmount(fd.get("amount")),due:fd.get("due")||"",start:freqVal==="One-Time"?(fd.get("start")||""):"",notes:String(fd.get("notes")||"").trim(),plan:planObj};
    var i=findBill(b.id); if(i>=0) state.bills[i]=b; else state.bills.push(b);
    closeSheet(); commit(); toast(id?"Saved":"Bill added");
    return;
  }
  if(f.id==="paymentForm"){
    var bi=findBill(f.dataset.bill); if(bi<0) return;
    var bill=state.bills[bi]; if(!bill.plan) return;
    var amt2=cleanAmount(fd.get("amount")); if(amt2===""||amt2<=0) return;
    var ptype=fd.get("ptype")||"scheduled";
    var peffect=ptype==="extra"?(fd.get("peffect")||"same"):null;
    var entry={id:uid(),date:fd.get("date")||toISO(todayDays()),amount:amt2,note:String(fd.get("note")||"").trim(),type:ptype,effect:peffect,prevAmount:null};
    if(ptype==="extra"&&peffect==="lower"){
      var piBefore=planInfo(bill), oldAmt=num(bill.amount)||0;
      entry.prevAmount=oldAmt;
      var cyclesBefore=oldAmt>0?Math.ceil((piBefore.remaining/oldAmt)-1e-9):0;
      var remAfter=Math.max(0,Math.round((piBefore.remaining-amt2)*100)/100);
      if(cyclesBefore>0&&remAfter>0) bill.amount=Math.round((remAfter/cyclesBefore)*100)/100;
    }
    bill.plan.log.push(entry);
    commit();
    openSheet("Edit bill",billForm(bill));
    toast(ptype==="extra"&&peffect==="lower"?"Payment logged. New payment: "+$m(num(bill.amount)):"Payment logged");
    return;
  }
  if(f.id==="catForm"){
    var gMap={}, groups=[];
    sheetBody.querySelectorAll("#grpList .mrow").forEach(function(r){
      if(r.classList.contains("removed")) return;
      var n=r.querySelector(".grpInput").value.trim(); if(!n) return;
      if(groups.indexOf(n)<0) groups.push(n);
      gMap[r.dataset.gkey]=n;
    });
    var cats=[], catGroup={}, rename={}, removed={};
    sheetBody.querySelectorAll("#catList .mrow").forEach(function(r){
      var key=r.dataset.ckey, orig=key.indexOf("c:")===0?key.slice(2):null;
      if(r.classList.contains("removed")){ if(orig) removed[orig]=true; return; }
      var n=r.querySelector(".catInput").value.trim()||orig; if(!n) return;
      if(orig&&n!==orig) rename[orig]=n;
      if(cats.indexOf(n)<0){
        cats.push(n);
        var gk=r.querySelector(".catGroupSel").value;
        if(gk&&own(gMap,gk)) catGroup[n]=gMap[gk];
      }
    });
    if(!cats.length){ document.getElementById("catErr").innerHTML='<p class="err">Keep at least one category.</p>'; return; }
    state.bills.forEach(function(bb){
      if(own(rename,bb.cat)) bb.cat=rename[bb.cat];
      else if(own(removed,bb.cat)&&cats.indexOf(bb.cat)<0) bb.cat="";
    });
    state.categories=cats; state.groups=groups; state.catGroup=catGroup;
    closeSheet(); commit(); toast("Categories saved");
    return;
  }
  if(f.id==="owedForm"){
    var who=String(fd.get("who")||"").trim();
    if(!who){ document.getElementById("whoErr").innerHTML='<p class="err">Add a name.</p>'; f.querySelector("[name=who]").focus(); return; }
    document.getElementById("whoErr").innerHTML="";
    var totalO=cleanAmount(fd.get("total")); if(totalO==="") totalO=0;
    var planO=null;
    if((fd.get("style")||"lump")==="plan"){ var instAmt=cleanAmount(fd.get("instamt")); planO={cycle:fd.get("cycle")||"Monthly",amount:instAmt===""?0:instAmt}; }
    var noDeadline=fd.get("nodeadline")==="on";
    var exi=id?findOwed(id):-1;
    var o={id:id||uid(),who:who,total:totalO,noDeadline:noDeadline,deadline:noDeadline?"":(fd.get("deadline")||""),notes:String(fd.get("notes")||"").trim(),plan:planO,
      log:exi>=0?state.owed[exi].log:[],extensions:exi>=0?state.owed[exi].extensions:[]};
    if(exi>=0) state.owed[exi]=o; else state.owed.push(o);
    closeSheet(); commit(); toast(id?"Saved":"Added");
    return;
  }
  if(f.id==="owedPayForm"){
    var oidx=findOwed(f.dataset.owed); if(oidx<0) return;
    var amtR=cleanAmount(fd.get("amount")); if(amtR===""||amtR<=0) return;
    state.owed[oidx].log.push({id:uid(),date:fd.get("date")||toISO(todayDays()),amount:amtR,note:String(fd.get("note")||"").trim()});
    commit();
    openSheet("Owed to you",owedForm(state.owed[oidx]));
    toast("Payment logged");
    return;
  }
  if(f.id==="owedExtForm"){
    var oidx2=findOwed(f.dataset.owed); if(oidx2<0) return;
    var nd=fd.get("newdeadline")||"";
    state.owed[oidx2].extensions.push({id:uid(),date:toISO(todayDays()),newDeadline:nd,note:String(fd.get("note")||"").trim()});
    state.owed[oidx2].deadline=nd; state.owed[oidx2].noDeadline=!nd;
    commit();
    openSheet("Owed to you",owedForm(state.owed[oidx2]));
    toast("Deadline updated");
    return;
  }
});
sheetBody.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  if(t.id==="addGrpRow"){
    document.getElementById("grpList").insertAdjacentHTML("beforeend",grpRowHtml("gn:"+uid(),""));
    refreshGroupSelects();
    var gi=sheetBody.querySelectorAll("#grpList .grpInput"); gi[gi.length-1].focus();
    return;
  }
  if(t.id==="addCatRow"){
    document.getElementById("catList").insertAdjacentHTML("beforeend",catRowHtml("cn:"+uid(),"",""));
    refreshGroupSelects();
    var ci=sheetBody.querySelectorAll("#catList .catInput"); ci[ci.length-1].focus();
    return;
  }
  if(t.hasAttribute("data-toggle-remove")){
    var row=t.closest(".mrow"), on=row.classList.toggle("removed");
    t.textContent=on?"Undo":"Remove";
    if(row.parentNode&&row.parentNode.id==="grpList") refreshGroupSelects();
    return;
  }
  if(t.id==="delBill"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Tap again to delete"; return; }
    var bid=sheetBody.querySelector("#billForm").dataset.id;
    var i=findBill(bid); if(i>=0) state.bills.splice(i,1);
    closeSheet(); commit(); toast("Deleted");
    return;
  }
  if(t.id==="undoBillPay"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Tap again to undo"; return; }
    var bi2=findBill(t.dataset.bill); if(bi2<0) return;
    var bill2=state.bills[bi2]; if(!bill2.plan||!bill2.plan.log.length) return;
    var popped=bill2.plan.log.pop();
    if(popped&&popped.prevAmount!==null&&popped.prevAmount!==undefined) bill2.amount=popped.prevAmount;
    commit();
    openSheet("Edit bill",billForm(bill2));
    toast("Payment undone");
    return;
  }
  if(t.id==="delOwed"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Tap again to delete"; return; }
    var oid=sheetBody.querySelector("#owedForm").dataset.id;
    var oi=findOwed(oid); if(oi>=0) state.owed.splice(oi,1);
    closeSheet(); commit(); toast("Deleted");
    return;
  }
  if(t.id==="undoOwedPay"){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Tap again to undo"; return; }
    var oi2=findOwed(t.dataset.owed); if(oi2<0) return;
    state.owed[oi2].log.pop();
    commit();
    openSheet("Owed to you",owedForm(state.owed[oi2]));
    toast("Payment undone");
    return;
  }
});

  if(el.hasAttribute("data-new-owed")){ openSheet("Owed to you",owedForm(null)); return; }
  if(el.dataset.editOwed){ var oIdx=findOwed(el.dataset.editOwed); if(oIdx>=0) openSheet("Owed to you",owedForm(state.owed[oIdx])); return; }
  if(el.dataset.moneyview){ moneyView=el.dataset.moneyview; document.getElementById("s-money").innerHTML=renderMoney(derive()); return; }
  if(el.dataset.go){
    if(el.dataset.go.indexOf("money")===0){
      moneyView=el.dataset.go==="money-owed"?"owed":"owe";
      document.getElementById("s-money").innerHTML=renderMoney(derive());
      showTab("money");
    } else showTab(el.dataset.go);
    return;
  }
  if(el.id==="copyBackup"){
    var code=JSON.stringify({app:"bill-tracker",schema:2,bills:state.bills,paycheck:state.paycheck,categories:state.categories,groups:state.groups,catGroup:state.catGroup,owed:state.owed});
    var done=function(){ toast("Backup copied"); };
    var manual=function(){ document.getElementById("backupOut").innerHTML='<div class="field" style="margin-top:12px"><label for="bk">Select all and copy</label><textarea id="bk" readonly></textarea></div>'; var t=document.getElementById("bk"); t.value=code; t.focus(); t.select(); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,manual); } else manual();
    return;
  }
  if(el.id==="doRestore"){
    var msg=document.getElementById("restoreMsg"), raw=document.getElementById("restoreText").value.trim();
    var data=null; try{ data=JSON.parse(raw); }catch(err){}
    if(!data||!Array.isArray(data.bills)){ msg.innerHTML='<p class="err" style="margin-top:10px">That doesn’t look like a backup from this app. Copy the whole thing and try again.</p>'; return; }
    if(!el.dataset.armed){ el.dataset.armed="1"; el.textContent="Tap again to replace all data"; msg.innerHTML='<p class="note" style="margin-top:10px">Found '+plural(data.bills.length,"bill")+'. Restoring replaces everything currently in the app.</p>'; return; }
    state=normalize(data); commit();
    document.getElementById("s-guide").innerHTML=renderGuide();
    toast("Backup restored");
  }
});
var payTimer=null;
document.querySelector("main").addEventListener("input",function(e){
  if(e.target.id!=="pay") return;
  var v=cleanAmount(e.target.value); state.paycheck=v===""?0:v;
  writeCache(); render();
  clearTimeout(payTimer); payTimer=setTimeout(function(){ state.updatedAt=new Date().toISOString(); writeCache(); },700);
});
document.querySelector("main").addEventListener("focusout",function(e){ if(e.target.id==="pay") setTimeout(render,0); });

/* ---------- keep the numbers current ---------- */
/* Recalculate whenever the app comes back on screen, even if an edit panel was left open,
   and catch the date rolling over (e.g. Wednesday to Thursday) while it stays open. */
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") render(); });
window.addEventListener("pageshow",function(e){ if(e.persisted) render(); });
window.addEventListener("focus",refreshIfNewDay);
setInterval(refreshIfNewDay,60000);

render();
})();
</script>
</body>
</html>
